# Production deploy on every push to main, strictly in order:
#   1. database migrations  2. create-booking-intent edge function  3. webapp
# A later step never runs if an earlier one fails. All credentials come from
# repo secrets (see SETUP.md). Nothing is inlined.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never interrupt a half-applied deploy

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  db:
    name: db-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.105.0 }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"

  functions:
    name: functions-deploy
    needs: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.105.0 }
      # --use-api bundles server-side, so the runner needs no Docker. JWT
      # verification follows supabase/config.toml.
      - run: supabase functions deploy create-booking-intent --project-ref "$SUPABASE_PROJECT_REF" --use-api

  webapp:
    name: webapp-deploy
    needs: functions
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: webapp } }
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm ci
      # Linux runner on purpose: OpenNext deploys from Windows corrupt the
      # Worker asset store. wrangler.jsonc carries the planenepal.com routes.
      - run: rm -rf .next .open-next && npx opennextjs-cloudflare build
      - run: npx opennextjs-cloudflare deploy
