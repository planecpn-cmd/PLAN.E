name: flutter

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze

      - name: Test (gate — excludes known-broken tags)
        run: flutter test --exclude-tags known-broken-layout

      - name: Known-broken tests (non-blocking, kept visible)
        continue-on-error: true
        run: |
          echo "::warning title=known-broken-layout::Pre-existing failing test(s). See docs/TODO.md."
          flutter test --tags known-broken-layout
