name: db

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sql-and-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start local Supabase stack
        run: supabase start

      - name: Full test suite (db reset + SQL + edge)
        run: bash scripts/test-all.sh

      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true
