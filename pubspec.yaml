name: plan_e
description: "PLAN E — Nepal Adventure & Travel App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  supabase_flutter: ^2.8.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  timezone: ^0.9.4
  shared_preferences: ^2.3.5
  image_picker: ^1.2.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_svg: ^2.0.10
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - env/
    - assets/images/
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript.ttf
